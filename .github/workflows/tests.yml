name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # requirements-ci.txt deliberately excludes sentence-transformers/torch,
      # chromadb, llmlingua, and markitdown (multi-GB, lazily imported, never
      # needed for pure-function unit tests). These flags must stay false here
      # so nothing in app/tests/ accidentally triggers one of those lazy
      # imports (e.g. guardrails_in.py's Layer 2 semantic check, or the
      # semantic cache) — if a test needs the real behaviour, use
      # requirements.txt (full install) in a separate, non-CI job instead of
      # silently expanding this file.
      ENABLE_SEMANTIC_GUARDRAILS: "false"
      ENABLE_SEMANTIC_CACHE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the dependency floor in requirements-ci.txt.
          # Do NOT use 3.14 (work-laptop version) — CI deps only guarantee 3.12+.
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run test suite
        run: pytest app/tests/ -v