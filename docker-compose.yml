services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gateway_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gateway_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── ChromaDB (Phase 3) ───────────────────────────────────────────────
  chromadb:
    image: chromadb/chroma:latest
    container_name: gateway_chroma
    restart: unless-stopped
    ports:
      - "8002:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  # ── Apache Superset (Phase 2) ─────────────────────────────────────────
  superset:
    image: apache/superset:latest
    container_name: gateway_superset
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: "superset-change-me"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - superset_data:/app/superset_home

  # ── Gateway app (FastAPI backend + built React dashboard) ──────────────
  # Built from the repo's own Dockerfile — multi-stage: compiles frontend/
  # then runs the backend, serving both from one container (see main.py's
  # StaticFiles mount). Not exposed directly to the internet — Caddy in
  # front handles TLS and is the only service with a public port.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gateway_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These override .env to use Docker's internal service DNS names
      # rather than localhost, since the app now runs in the same Compose
      # network as its dependencies instead of on the host directly.
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8001"

  # ── Caddy reverse proxy — automatic HTTPS via Let's Encrypt ────────────
  # The only service with ports exposed to the public internet.
  caddy:
    image: caddy:2-alpine
    container_name: gateway_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  postgres_data:
  chroma_data:
  superset_data:
  caddy_data:
  caddy_config: